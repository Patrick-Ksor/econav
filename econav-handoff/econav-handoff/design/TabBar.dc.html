<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 390px; height: 84px; box-sizing: border-box; padding: 6px 12px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: {{bg}}; border-top: 1px solid {{border}}; font-family: Inter, system-ui, sans-serif">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" aria-current="{{t.current}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; text-decoration: none; color: {{t.color}}; font-size: 11px; font-weight: {{t.weight}}; letter-spacing: 0.01em">
<span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px; border-radius: 14px; background: {{t.pill}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
</span>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","garage","savings","profile"],"default":"home"},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":84}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const dark = this.props.dark === true || this.props.dark === 'true';
    const on = dark ? '#4ADE80' : '#14532D';
    const off = dark ? '#94A3B8' : '#64748B';
    const pill = dark ? 'rgba(34,197,94,0.16)' : '#DCFCE7';
    const defs = [
      { id: 'home', label: 'Home', href: dark ? 'HomeDark.dc.html' : 'Home.dc.html', d: 'M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z' },
      { id: 'garage', label: 'Garage', href: 'Garage.dc.html', d: 'M5 17H3v-4l2-5.2A2 2 0 0 1 6.9 6.5h10.2A2 2 0 0 1 19 7.8l2 5.2v4h-2M9 17h6M3 13h18M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z' },
      { id: 'savings', label: 'Savings', href: 'Savings.dc.html', d: 'M4 20V11M10 20V5M16 20v-6M21 20H3' },
      { id: 'profile', label: 'Profile', href: 'Profile.dc.html', d: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 21a7.5 7.5 0 0 1 15 0' }
    ];
    return {
      bg: dark ? '#0F1A16' : '#FFFFFF',
      border: dark ? '#1F2D27' : '#E2E8F0',
      tabs: defs.map((t) => ({
        ...t,
        current: t.id === active ? 'page' : undefined,
        color: t.id === active ? on : off,
        weight: t.id === active ? 700 : 500,
        pill: t.id === active ? pill : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>

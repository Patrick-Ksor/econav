<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile and settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14532D}a:hover{color:#0F3D21}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; overflow: hidden; background: #F8FAFC; font-family: Inter, system-ui, sans-serif; color: #0F172A">
<div style="box-sizing: border-box; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.025em">Profile</h1>
<a href="#personal" style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #FFFFFF; border: 1px solid #E2E8F0; text-decoration: none; color: #0F172A">
<span style="display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 28px; background: #DCFCE7; color: #14532D; font-size: 20px; font-weight: 800">MC</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 700">Maya Chen</span><span style="font-size: 13px; color: #64748B">maya.chen@example.com</span><span style="font-size: 12px; color: #64748B">Member since May 2026</span></span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #64748B">{{g.title}}</h2>
<div style="display: flex; flex-direction: column; border-radius: 18px; background: #FFFFFF; border: 1px solid #E2E8F0; overflow: hidden">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; min-height: 54px; box-sizing: border-box; padding: 0 14px; border-top: {{r.divider}}; text-decoration: none; color: {{r.color}}">
<span aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 10px; background: {{r.iconBg}}; color: {{r.iconFg}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{r.d}}"></path></svg></span>
<span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{r.label}}</span>
<span style="font-size: 13px; color: #64748B; text-align: right">{{r.value}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</sc-for>
</div>
</section>
</sc-for>

<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E2E8F0; color: #0F172A; font-size: 15px; font-weight: 700; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>Log out</a>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="TabBar" active="profile" hint-size="390px,84px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      car: 'M5 17H3v-4l2-5.2A2 2 0 0 1 6.9 6.5h10.2A2 2 0 0 1 19 7.8l2 5.2v4h-2M9 17h6M3 13h18M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      sliders: 'M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4',
      fuel: 'M4 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M3 21h13M4 10h11M15 8l3 2v7a1.5 1.5 0 0 0 3 0V9l-3-3',
      ruler: 'M3 17 17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2',
      shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
      pin: 'M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21zM12 12a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
      download: 'M12 4v11M7 10l5 5 5-5M4 20h16',
      trash: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
      help: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.6M12 17h.01',
      mail: 'M3 6h18v12H3zM3 7l9 6 9-6'
    };
    const G = [
      { title: 'Driving', rows: [
        { label: 'Default vehicle', value: '2021 RAV4', d: I.car, href: 'Garage.dc.html' },
        { label: 'Route optimization', value: 'Balanced · $18/hr', d: I.sliders, href: 'RoutePrefs.dc.html' },
        { label: 'Fuel price', value: 'Local · $3.29', d: I.fuel, href: 'RoutePrefs.dc.html' },
        { label: 'Units & currency', value: 'mi · MPG · USD', d: I.ruler, href: '#units' }
      ] },
      { title: 'Privacy', rows: [
        { label: 'Location access', value: 'While using', d: I.pin, href: '#location' },
        { label: 'Privacy settings', value: '', d: I.shield, href: '#privacy' }
      ] },
      { title: 'Your data', rows: [
        { label: 'Export my data', value: 'CSV', d: I.download, href: '#export' },
        { label: 'Delete account', value: '', d: I.trash, href: '#delete', danger: true }
      ] },
      { title: 'Support', rows: [
        { label: 'Help center', value: '', d: I.help, href: '#help' },
        { label: 'Contact support', value: '', d: I.mail, href: '#contact' }
      ] }
    ];
    return {
      groups: G.map((g) => ({
        ...g,
        rows: g.rows.map((r, i) => ({
          ...r,
          divider: i === 0 ? '0' : '1px solid #E2E8F0',
          color: r.danger ? '#B91C1C' : '#0F172A',
          iconBg: r.danger ? '#FEF2F2' : '#F0FDF4',
          iconFg: r.danger ? '#B91C1C' : '#14532D'
        }))
      }))
    };
  }
}
</script>
</body>
</html>

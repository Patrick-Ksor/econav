<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: {{h}}px; overflow: hidden; background: {{c.bg}}; font-family: Inter, system-ui, sans-serif; color: #0F172A">
<svg viewBox="0 0 390 300" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="display: block" role="img" aria-label="{{label}}">
<rect x="0" y="0" width="390" height="300" fill="{{c.bg}}"></rect>
<path d="M352 -10 C330 50 372 110 350 170 C332 222 366 262 350 310 L400 310 L400 -10 Z" fill="{{c.water}}"></path>
<g fill="none" stroke="{{c.minor}}" stroke-width="5" stroke-linecap="round">
<path d="M30 0V300M64 0V300M100 0V300M200 0V300M250 0V300M290 0V300"></path>
<path d="M0 28H340M0 58H340M0 90H340M0 120H340M0 160H340M0 230H340M0 246H340"></path>
</g>
<rect x="8" y="132" width="50" height="20" rx="6" fill="{{c.park}}"></rect>
<rect x="160" y="208" width="34" height="16" rx="6" fill="{{c.park}}"></rect>
<rect x="206" y="32" width="38" height="20" rx="6" fill="{{c.park}}"></rect>
<rect x="106" y="94" width="38" height="22" rx="6" fill="{{c.park}}"></rect>
<g fill="none" stroke-linecap="round">
<path d="M0 200H344M150 0V300" stroke="{{c.majorEdge}}" stroke-width="11"></path>
<path d="M0 200H344M150 0V300" stroke="{{c.major}}" stroke-width="8"></path>
<path d="M0 262H200Q300 266 332 200V0" stroke="{{c.hwyEdge}}" stroke-width="14"></path>
<path d="M0 262H200Q300 266 332 200V0" stroke="{{c.hwy}}" stroke-width="10"></path>
</g>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="{{threeOp}}">
<path d="M64 246V262H200Q300 266 332 200V70L318 58" stroke="{{c.casing}}" stroke-width="10" opacity="{{oFast}}"></path>
<path d="M64 246V262H200Q300 266 332 200V70L318 58" stroke="{{c.fast}}" stroke-width="6" opacity="{{oFast}}"></path>
<path d="M64 246V200H150V120H250V58H318" stroke="{{c.casing}}" stroke-width="10" opacity="{{oCheap}}"></path>
<path d="M64 246V200H150V120H250V58H318" stroke="{{c.cheap}}" stroke-width="6" opacity="{{oCheap}}"></path>
<path d="M64 246H100V160H200V90H290L318 58" stroke="{{c.casing}}" stroke-width="10" opacity="{{oBal}}"></path>
<path d="M64 246H100V160H200V90H290L318 58" stroke="{{c.bal}}" stroke-width="6" opacity="{{oBal}}"></path>
<path d="{{selD}}" stroke="{{c.casing}}" stroke-width="12"></path>
<path d="{{selD}}" stroke="{{selColor}}" stroke-width="8"></path>
</g>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="{{singleOp}}">
<path d="M64 246H100V160H200V90H290L318 58" stroke="{{c.casing}}" stroke-width="11"></path>
<path d="M64 246H100V160H200V90H290L318 58" stroke="{{c.bal}}" stroke-width="7"></path>
</g>
<g opacity="{{threeOp}}" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700">
<rect x="104" y="130" width="92" height="24" rx="12" fill="{{c.bal}}"></rect>
<text x="150" y="146" text-anchor="middle" fill="#FFFFFF">$7.50 · 33 min</text>
<rect x="256" y="96" width="88" height="22" rx="11" fill="#FFFFFF" stroke="{{c.cheap}}" stroke-width="1.5"></rect>
<text x="300" y="111" text-anchor="middle" fill="#0F172A">$7.13 · 41 min</text>
<rect x="206" y="270" width="96" height="22" rx="11" fill="#FFFFFF" stroke="{{c.fast}}" stroke-width="1.5"></rect>
<text x="254" y="285" text-anchor="middle" fill="#0F172A">$11.55 · 29 min</text>
</g>
<g opacity="{{markOp}}">
<circle cx="64" cy="246" r="14" fill="{{c.dot}}" opacity="0.15"></circle>
<circle cx="64" cy="246" r="8" fill="#FFFFFF"></circle>
<circle cx="64" cy="246" r="5" fill="{{c.dot}}"></circle>
<circle cx="318" cy="58" r="12" fill="{{c.pin}}" stroke="#FFFFFF" stroke-width="3"></circle>
<circle cx="318" cy="58" r="4" fill="#FFFFFF"></circle>
</g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"h":{"editor":"int","default":260,"min":80,"max":1200},"routes":{"editor":"enum","options":["none","single","three"],"default":"three"},"sel":{"editor":"enum","options":["bal","cheap","fast"],"default":"bal"},"tone":{"editor":"enum","options":["light","dark","forest"],"default":"light"},"$preview":{"width":390,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const P = {
      light: { bg: '#E8EEE8', water: '#CCDFEC', park: '#D2E5CF', minor: '#FFFFFF', major: '#FFFFFF', majorEdge: '#D3DBD3', hwy: '#FBE3B3', hwyEdge: '#E9C98C', casing: '#FFFFFF', bal: '#14532D', cheap: '#2563EB', fast: '#F59E0B', pin: '#14532D', dot: '#0F172A' },
      dark: { bg: '#0D1613', water: '#0F2233', park: '#13261C', minor: '#1A2622', major: '#24332D', majorEdge: '#1A2622', hwy: '#3B3222', hwyEdge: '#2C261A', casing: '#0D1613', bal: '#22C55E', cheap: '#60A5FA', fast: '#FBBF24', pin: '#22C55E', dot: '#F1F5F9' },
      forest: { bg: '#14532D', water: '#104526', park: '#18603A', minor: '#1B6337', major: '#22713F', majorEdge: '#175A31', hwy: '#2A7D47', hwyEdge: '#1E6B3A', casing: '#14532D', bal: '#22C55E', cheap: '#93C5FD', fast: '#FCD34D', pin: '#22C55E', dot: '#FFFFFF' }
    };
    const tone = this.props.tone ?? 'light';
    const c = P[tone] || P.light;
    const routes = this.props.routes ?? 'three';
    const sel = this.props.sel ?? 'bal';
    const D = {
      bal: 'M64 246H100V160H200V90H290L318 58',
      cheap: 'M64 246V200H150V120H250V58H318',
      fast: 'M64 246V262H200Q300 266 332 200V70L318 58'
    };
    const three = routes === 'three';
    return {
      c,
      h: this.props.h ?? 260,
      threeOp: three ? 1 : 0,
      singleOp: routes === 'single' ? 1 : 0,
      markOp: routes === 'none' ? 0 : 1,
      oBal: sel === 'bal' ? 1 : 0.55,
      oCheap: sel === 'cheap' ? 1 : 0.55,
      oFast: sel === 'fast' ? 1 : 0.55,
      selD: three ? D[sel] : 'M0 0',
      selColor: c[sel],
      label: three ? 'Map showing three alternative routes from your location to Harbor View Office Park' : 'Map of the area around your location'
    };
  }
}
</script>
</body>
</html>

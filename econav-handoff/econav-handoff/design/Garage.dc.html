<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14532D}a:hover{color:#0F3D21}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; overflow: hidden; background: #F8FAFC; font-family: Inter, system-ui, sans-serif; color: #0F172A; font-variant-numeric: tabular-nums">
<div style="box-sizing: border-box; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.025em">Garage</h1>
<span style="font-size: 14px; color: #64748B">3 vehicles · costs update every trip</span>
</div>
<a href="AddVehicle.dc.html" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border-radius: 14px; background: #14532D; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add Vehicle</a>
</div>

<sc-for list="{{cars}}" as="car" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; padding: 16px; border-radius: 22px; background: #FFFFFF; border: {{car.border}}; box-shadow: {{car.shadow}}">
<sc-if value="{{car.photo}}" hint-placeholder-val="{{ false }}">
<div role="img" aria-label="Vehicle photo placeholder" style="position: relative; height: 120px; border-radius: 14px; background: repeating-linear-gradient(135deg, #F1F5F9 0 10px, #E8EEF3 10px 20px); display: flex; align-items: center; justify-content: center; color: #64748B; font-size: 12px; font-weight: 600">[Vehicle photo]</div>
</sc-if>
<div style="display: flex; align-items: center; gap: 12px">
<sc-if value="{{car.noPhoto}}" hint-placeholder-val="{{ true }}">
<span aria-hidden="true" style="flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; background: #F1F5F9; color: #64748B; font-size: 14px; font-weight: 700">{{car.initials}}</span>
</sc-if>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 500; color: #64748B">{{car.year}} {{car.make}}</span>
<span style="font-size: 18px; font-weight: 700; letter-spacing: -0.01em">{{car.model}}</span>
<span style="font-size: 12px; color: #64748B">{{car.trim}}</span>
</div>
<sc-if value="{{car.isSel}}" hint-placeholder-val="{{ false }}">
<span style="display: flex; align-items: center; gap: 4px; padding: 5px 9px; border-radius: 8px; background: #DCFCE7; color: #14532D; font-size: 12px; font-weight: 700">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>Selected</span>
</sc-if>
<sc-if value="{{car.notSel}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{car.pick}}" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #E2E8F0; background: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; color: #0F172A">Use this car</button>
</sc-if>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #F8FAFC"><span style="font-size: 11px; font-weight: 500; color: #64748B">Fuel type</span><span style="font-size: 15px; font-weight: 700">{{car.fuel}}</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #F8FAFC"><span style="font-size: 11px; font-weight: 500; color: #64748B">Combined</span><span style="font-size: 15px; font-weight: 700">{{car.mpg}} MPG</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #F8FAFC"><span style="font-size: 11px; font-weight: 500; color: #64748B">Fuel price</span><span style="font-size: 15px; font-weight: 700">$3.29/gal</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 12px; background: #F8FAFC"><span style="font-size: 11px; font-weight: 500; color: #64748B">Depreciation</span><span style="font-size: 15px; font-weight: 700">{{car.dep}}/mi</span></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid #E2E8F0">
<span style="font-size: 13px; color: #64748B">Est. cost per mile <strong style="font-size: 15px; font-weight: 800; color: #0F172A">{{car.cpm}}</strong></span>
<div style="display: flex; gap: 4px">
<a href="AddVehicle.dc.html" aria-label="Edit {{car.model}}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; color: #334155"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"></path></svg></a>
<button type="button" aria-label="Delete {{car.model}}" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: transparent; color: #B91C1C"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
</div>
</div>
</div>
</sc-for>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0">
<dc-import name="TabBar" active="garage" hint-size="390px,84px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'rav4' };
  }
  renderVals() {
    const list = [
      { id: 'rav4', year: 2021, make: 'Toyota', model: 'RAV4 XLE', trim: '2.5L 4-cyl · 8-speed automatic', fuel: 'Gasoline', mpg: 30, dep: '$0.18', cpm: '$0.29', initials: 'RV', photo: true },
      { id: 'civic', year: 2019, make: 'Honda', model: 'Civic EX', trim: '1.5L turbo 4-cyl · CVT', fuel: 'Gasoline', mpg: 36, dep: '$0.12', cpm: '$0.21', initials: 'CV', photo: false },
      { id: 'f150', year: 2022, make: 'Ford', model: 'F-150 XLT', trim: '3.5L V6 turbo · 10-speed automatic', fuel: 'Gasoline', mpg: 20, dep: '$0.24', cpm: '$0.40', initials: 'FX', photo: false }
    ];
    const sel = this.state.sel;
    return {
      cars: list.map((c) => {
        const on = c.id === sel;
        return {
          ...c,
          photo: c.photo,
          noPhoto: !c.photo,
          notSel: !on,
          isSel: on,
          border: on ? '2px solid #14532D' : '1px solid #E2E8F0',
          shadow: on ? '0 10px 28px rgba(20,83,45,0.12)' : 'none',
          pick: () => this.setState({ sel: c.id })
        };
      })
    };
  }
}
</script>
</body>
</html>
